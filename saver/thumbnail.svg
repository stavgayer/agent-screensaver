<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580">
  <title>Agent Screen Saver thumbnail</title>
  <!-- The screen saver at night: one approval card with the attention dot,
       the cards of running agents below. Same family as the app icon
       (internal/platform/appicon.svg). Rendered to thumbnail.png (90x58)
       and thumbnail@2x.png (180x116). -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3260"/>
      <stop offset="1" stop-color="#0b0d1e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy="1" r=".85">
      <stop offset="0" stop-color="#56e0e6" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#6476ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6476ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9deeb"/>
    </linearGradient>
    <radialGradient id="dot" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ee3d16"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#05061a" flood-opacity=".5"/>
    </filter>
    <!-- The dot cuts a ring out of the card, as in the menu bar icon. -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="580">
      <rect width="900" height="580" fill="#fff"/>
      <circle cx="634" cy="106" r="76" fill="#000"/>
    </mask>
  </defs>
  <rect width="900" height="580" fill="url(#ground)"/>
  <rect width="900" height="580" fill="url(#glow)"/>
  <g fill="#fff" fill-opacity=".16">
    <rect x="96" y="440" width="216" height="72" rx="18"/>
    <rect x="342" y="440" width="216" height="72" rx="18"/>
    <rect x="588" y="440" width="216" height="72" rx="18"/>
  </g>
  <g mask="url(#cut)">
    <g filter="url(#shadow)">
      <rect x="250" y="100" width="400" height="236" rx="40" fill="url(#card)"/>
    </g>
    <g fill="#2c3260">
      <rect x="300" y="160" width="220" height="40" rx="20"/>
      <rect x="300" y="228" width="300" height="24" rx="12" fill-opacity=".35"/>
      <rect x="300" y="270" width="180" height="24" rx="12" fill-opacity=".35"/>
    </g>
  </g>
  <circle cx="634" cy="106" r="54" fill="url(#dot)"/>
</svg>
